<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: sans-serif; font-size: 12px; color: var(--uxp-host-text-color, #ddd); background: var(--uxp-host-background-color, #232323); margin: 8px; }
      .row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
      #root { flex: 1; min-width: 120px; word-break: break-all; opacity: 0.85; }
      #summary { margin: 6px 0; }
      table { width: 100%; border-collapse: collapse; font-size: 11px; }
      td, th { text-align: left; padding: 2px 4px; border-bottom: 1px solid #3a3a3a; }
      .low { color: #ff6b6b; }
      .placed { opacity: 0.55; }
      #log { height: 180px; overflow-y: auto; background: #1a1a1a; padding: 4px; font-family: monospace; font-size: 11px; white-space: pre-wrap; }
      .warn { color: #e8c14a; }
      .error { color: #ff6b6b; }
    </style>
  </head>
  <body>
    <div class="row">
      <sp-button id="pick" variant="secondary">Pick project_root</sp-button>
      <span id="root">(no folder)</span>
    </div>
    <div class="row">
      <sp-button id="reload" variant="secondary">Reload shot list</sp-button>
      <sp-button id="dryrun" variant="secondary">Dry run</sp-button>
      <sp-button id="build" variant="cta">Build B-roll sequence</sp-button>
    </div>
    <div class="row">
      <sp-button id="runjob" variant="secondary">Run pending job</sp-button>
      <sp-checkbox id="watch">Watch for jobs</sp-checkbox>
    </div>
    <div id="summary">Pick the project_root folder that holds shot_list.json.</div>
    <div style="max-height: 200px; overflow-y: auto">
      <table id="shots"></table>
    </div>
    <h4>Log</h4>
    <div id="log"></div>
    <script src="main.js"></script>
  </body>
</html>
